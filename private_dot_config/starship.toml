# Get editor completion based on the config schema
'$schema' = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Format of the main prompt
format = '''$character$os$all🦊 '''

# Inserts content to the right prompt on supported shells
right_format = '''$battery$time'''

# First symbol of the prompt
[character]
success_symbol = '[❯❯](bold green)'
error_symbol = '[❯❯](bold red)'

[username]
show_always = true
style_root = 'red bold'
style_user = 'purple bold'
format = '[$user]($style) in '

[directory]
read_only = ' 󰌾'

# Battery display at different levels
[[battery.display]]
threshold = 25
style = 'bold red'

[[battery.display]]
threshold = 40
style = 'bold yellow'

[[battery.display]]
threshold = 100
style = 'white'

[time]
disabled = false
format = '$time' # Remove style

# [memory_usage]
# symbol = '󰍛 '

[git_branch]
symbol = ' '
style = 'bold red'

[git_commit]
tag_symbol = '  '
style = 'bold yellow'

[git_status]
stashed = '◆ $count '
conflicted = '✘ '
modified = '[!=](yellow) '
staged = '[++\($count\)](orange) '
deleted = ''
renamed = ''
untracked = '[?](yellow) '
up_to_date = '[√](green)'
ahead = '↑ ${count}'
behind = '↓ ${count}'
diverged = '⇕ ↑ ${ahead_count} ↓ ${behind_count}'

format = "([\\[$all_status$ahead_behind\\]]($style)) "

# Languages/envs
[os]
disabled = false
style = 'bold white'
format = '[$symbol]($style) '

