#
# GENERAL
#

# TODO: Add device-specific configurations.
# This would be useful for monitors configuration
# and some misc/performance/input settings

#
# MONITORS
#

# See https://wiki.hyprland.org/Configuring/Monitors/

monitor=eDP-1,1920x1080@144,0x0,1
monitor=HDMI-A-1,highres@highrr,1920x0,auto
monitor=,preferred,auto,auto


#
# MY PROGRAMS
#

# See https://wiki.hyprland.org/Configuring/Keywords/

$terminal = uwsm app -- kitty
$fileManager = uwsm app -- thunar
$menu = rofi -show drun -run-command "uwsm app -- {cmd}"
$emojiPicker = rofi -modi emoji -emoji-mode insert_no_copy -show emoji

$screenshot = grim "$HOME/Pictures/Screenshots"/"Screenshot_$(date +%Y%m%d-%H%M%S).png"
$screenshotRegion = grim -g "$(slurp -d)" - | wl-copy

$clipboardHistory = cliphist list | rofi -dmenu | cliphist decode | wl-copy

#
# AUTOSTART
#

# exec-once = uwsm app -- waybar
exec-once = [workspace 1] uwsm app -- $terminal
exec-once = [workspace 2] uwsm app -- firefox

exec-once = uwsm app -- wl-paste --type text --watch cliphist store # Stores text data
exec-once = uwsm app -- wl-paste --type image --watch cliphist store # Stores image data


#
# OTHER CONFIGURATION FILES
#

source = ~/.config/hypr/custom/devices.conf
source = ~/.config/hypr/custom/keymap.conf
source = ~/.config/hypr/custom/style.conf


#
# WINDOWS AND WORKSPACES
#

# See https://wiki.hyprland.org/Configuring/Window-Rules/
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/

# Prevent idling
windowrule = idleinhibit fullscreen, class:,*
windowrule = idleinhibit always, title:^(Picture-in-Picture)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

#
# ENVIRONMENT VARIABLES
#

# Using `uwsm`. Set env vars accordlingly.
# See https://wiki.hypr.land/Useful-Utilities/Systemd-start/
# See https://wiki.hyprland.org/Configuring/Environment-variables/

#
# PERMISSIONS
#

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

